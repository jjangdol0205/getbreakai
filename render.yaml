services:
  - type: web
    name: truthofmarket-static
    runtime: static
    buildCommand: ""
    staticPublishPath: ./dist
    domains:
      - truthofmarket.com
      - www.truthofmarket.com
    headers:
      - path: /rss.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /feed.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
    routes:
      - type: rewrite
        source: /api/health
        destination: /static_api/health.json
      - type: rewrite
        source: /api/stocks
        destination: /static_api/stocks_free.json
      - type: rewrite
        source: /api/backtest
        destination: /static_api/backtest.json
      - type: rewrite
        source: /api/research
        destination: /static_api/research_list.json
      - type: rewrite
        source: /api/pro/pinescript
        destination: /static_api/pinescript.json
      - type: rewrite
        source: /api/referral/config
        destination: /static_api/referral_config.json
      - type: rewrite
        source: /api/telegram/status
        destination: /static_api/telegram_status.json
      - type: rewrite
        source: /api/telegram/config
        destination: /static_api/telegram_status.json
      - type: rewrite
        source: /api/semi/overview
        destination: /static_api/semi_overview.json
      - type: rewrite
        source: /api/semi/history
        destination: /static_api/semi_history_1Y.json
      - type: rewrite
        source: /api/semi/pro/csv
        destination: /static_api/smh_xlv_fear_greed_history.csv
      - type: rewrite
        source: /api/semi/download-csv
        destination: /static_api/smh_xlv_fear_greed_history.csv
      - type: rewrite
        source: /*
        destination: /index.html
