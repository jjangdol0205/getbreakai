services:
  - type: web
    name: getbreakai-static
    runtime: static
    buildCommand: ""
    staticPublishPath: ./dist
    domains:
      - getbreakai.com
      - www.getbreakai.com
    routes:
      - type: rewrite
        source: /api/health
        destination: /static_api/health.json
      - type: rewrite
        source: /api/stocks
        destination: /static_api/stocks_free.json
      - type: rewrite
        source: /api/backtest
        destination: /static_api/backtest.json
      - type: rewrite
        source: /api/research
        destination: /static_api/research_list.json
      - type: rewrite
        source: /api/referral/config
        destination: /static_api/referral_config.json
      - type: rewrite
        source: /api/semi/overview
        destination: /static_api/semi_overview.json
      - type: rewrite
        source: /api/semi/download-csv
        destination: /static_api/smh_xlv_fear_greed_history.csv
      - type: rewrite
        source: /api/telegram/status
        destination: /static_api/telegram_status.json
      - type: rewrite
        source: /*
        destination: /index.html
